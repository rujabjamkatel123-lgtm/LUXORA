{% extends 'layouts/base.html' %}
{% block title %}
Sign in · LUXORA
{% endblock %}
{% block content %}
<main class="grid min-h-[720px] place-items-center px-5 py-16">
<div class="w-full max-w-md bg-white p-8 shadow-xl sm:p-12">
<p class="text-[11px] font-bold uppercase tracking-[0.2em] text-gold">Welcome back</p>
<h1 class="mt-3 font-display text-5xl">Sign in</h1>
<form class="mt-8 grid gap-5" method="post">
<input type="hidden" name="next" value="{{ next }}">
<label class="grid gap-2 text-xs font-semibold">Email<input class="border border-stone-300 px-4 py-3 font-normal outline-none focus:border-gold" type="email" name="email" required>
</label>
<label class="grid gap-2 text-xs font-semibold">Password<input class="border border-stone-300 px-4 py-3 font-normal outline-none focus:border-gold" type="password" name="password" required>
</label>
<button class="bg-ink px-5 py-4 text-sm font-semibold text-white">Sign in</button>
</form>
<p class="mt-6 text-sm text-stone-500">
<a class="underline" href="{{ url_for('auth.forgot') }}">Forgot password?</a>
</p>
<p class="mt-4 text-sm text-stone-500">New to LUXORA? <a class="text-gold underline" href="{{ url_for('auth.register', next=next) }}">Create an account</a>
</p>
</div>
</main>
{% endblock %}
