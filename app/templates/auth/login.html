{% extends 'auth/_shell.html' %}
{% from 'components/icons.html' import icon %}

{% block title %}Sign in · LUXORA{% endblock %}

{% block auth_body %}
<p class="lux-eyebrow lux-eyebrow--signal">Welcome back</p>
<h1 class="mt-4 font-display text-[clamp(2.5rem,6vw,4rem)] uppercase">Sign in</h1>
<p class="mt-4 text-sm leading-7 lux-muted">Access your orders, wishlist and saved addresses.</p>

<form class="mt-9 grid gap-5" method="post">
    <input type="hidden" name="next" value="{{ next }}">

    <label class="lux-field">
        <span class="lux-label">Email</span>
        <input class="lux-input" type="email" name="email" autocomplete="email" required>
    </label>

    <label class="lux-field">
        <span class="lux-label">Password</span>
        <input class="lux-input" type="password" name="password" autocomplete="current-password" required>
    </label>

    <button class="lux-btn lux-btn--primary lux-btn--lg lux-btn--block mt-1" type="submit">
        Sign in {{ icon('arrow-right', 'h-4 w-4') }}
    </button>
</form>

<div class="mt-8 grid gap-4 border-t border-line-soft pt-7 text-sm">
    <a class="lux-nav-link justify-self-start" href="{{ url_for('auth.forgot') }}">Forgot password?</a>
    <p class="lux-muted">
        New to LUXORA?
        <a class="font-semibold text-ink underline decoration-signal decoration-2 underline-offset-4" href="{{ url_for('auth.register', next=next) }}">Create an account</a>
    </p>
</div>
{% endblock %}
