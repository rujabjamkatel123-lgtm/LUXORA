{% extends 'layouts/base.html' %}
{% block content %}
<main class="grid min-h-[650px] place-items-center px-5">
<div class="w-full max-w-md bg-white p-10 shadow-xl">
<p class="text-[11px] font-bold uppercase tracking-[0.2em] text-gold">Account recovery</p>
<h1 class="mt-3 font-display text-5xl">Choose a new password</h1>
<form class="mt-8 grid gap-5" method="post">
<input class="border border-stone-300 px-4 py-3" type="password" name="password" minlength="8" placeholder="New password" required>
<button class="bg-ink px-5 py-4 text-sm font-semibold text-white">Update password</button>
</form>
</div>
</main>
{% endblock %}
