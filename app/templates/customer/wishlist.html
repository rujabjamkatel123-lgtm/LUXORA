{% extends 'layouts/base.html' %}
{% block content %}
<main class="mx-auto max-w-7xl px-5 py-16 lg:px-8">
<p class="text-[11px] font-bold uppercase tracking-[0.2em] text-gold">Saved for later</p>
<h1 class="mt-3 font-display text-6xl">Your wishlist</h1>
{% if products %}
<div class="mt-10 grid gap-x-5 gap-y-12 sm:grid-cols-2 lg:grid-cols-4">
{% for p in products %}
{% include 'components/product_card.html' %}
{% endfor %}
</div>
{% else %}
<div class="mt-10 bg-white py-24 text-center">
<h2 class="font-display text-3xl">Your wishlist is empty</h2>
<a class="mt-6 inline-block bg-ink px-6 py-3 text-sm text-white" href="{{ url_for('store.shop') }}">Explore products</a>
</div>
{% endif %}
</main>
{% endblock %}
