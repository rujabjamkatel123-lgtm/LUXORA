{% extends 'layouts/base.html' %}
{% block content %}
<main class="mx-auto max-w-2xl px-5 py-16">
<p class="text-[11px] font-bold uppercase tracking-[0.2em] text-gold">Order #{{ order.id }}</p>
<h1 class="mt-3 font-display text-6xl">Track your order</h1>
<div class="mt-10 border-l-2 border-stone-200 pl-7">
{% for s in ['Pending','Confirmed','Processing','Shipped','Out for Delivery','Delivered'] %}
<div class="relative border-b border-stone-100 py-5
{% if s == order.status %}
text-ink
{% else %}
text-stone-400
{% endif %}
">
<span class="absolute -left-[39px] top-6 h-4 w-4 rounded-full border-4 border-cream
{% if s == order.status %}
bg-gold
{% else %}
bg-stone-300
{% endif %}
">
</span>
<b>{{ s }}</b>
{% if s == order.status %}
<p class="mt-1 text-xs text-gold">Current status</p>
{% endif %}
</div>
{% endfor %}
</div>
<a class="mt-8 inline-block border border-ink px-6 py-3 text-sm" href="{{ url_for('store.account') }}">Back to account</a>
</main>
{% endblock %}
